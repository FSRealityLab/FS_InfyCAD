name: Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release -p infycad-app
      - uses: actions/upload-artifact@v4
        with:
          name: FS_InfyCAD-windows-x64
          path: target/release/infycad.exe
          if-no-files-found: error
